<div class="bg-wt-bg-card rounded-xl lg:rounded-2xl border border-wt-border-subtle overflow-hidden">
    <div class="px-4 lg:px-5 py-3 lg:py-4 border-b border-wt-border-subtle flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i data-lucide="server" class="w-4 h-4 text-wt-text-tertiary"></i>
            <h2 class="font-display text-sm lg:text-base font-bold text-wt-text-primary">Service Health</h2>
        </div>
        <span class="text-[10px] text-wt-text-tertiary" data-timestamp="{{ health.checked_at }}"></span>
    </div>
    <div class="divide-y divide-wt-border-subtle">
        {% for service in health.services %}
        <div class="flex items-center justify-between px-4 lg:px-5 py-2.5 lg:py-3">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full {% if service.healthy %}bg-wt-accent-green{% else %}bg-wt-accent-red{% endif %}"></div>
                <span class="text-xs lg:text-sm font-medium text-wt-text-primary">{{ service.name }}</span>
            </div>
            <div class="flex items-center gap-2">
                {% match service.response_time_ms %}
                {% when Some with (ms) %}
                <span class="text-[10px] lg:text-xs text-wt-text-tertiary">{{ ms }}ms</span>
                {% when None %}
                {% endmatch %}
                {% match service.error %}
                {% when Some with (err) %}
                <span class="text-[10px] lg:text-xs text-wt-accent-red truncate max-w-24" title="{{ err }}">{{ err }}</span>
                {% when None %}
                {% endmatch %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script>lucide.createIcons(); formatAllTimestamps();</script>
