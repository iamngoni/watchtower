<div class="bg-white dark:bg-wt-bg-page rounded-xl border border-wt-border-default p-3.5 space-y-2.5 cursor-pointer task-card hover:border-wt-accent-indigo/50 transition-colors relative group" 
     data-task-id="{{ task.id }}"
     data-priority="{{ task.priority }}"
     data-assigned="{{ task.assigned_to }}"
     data-created-by="{{ task.created_by }}"
     data-status="{{ task.status }}"
     onclick="openTaskDetail({{ task.id }})">
    <!-- Quick Actions Menu Button -->
    <button 
        onclick="event.stopPropagation(); toggleTaskMenu({{ task.id }})" 
        class="absolute top-2 right-2 p-1.5 rounded-lg hover:bg-wt-bg-card text-wt-text-tertiary hover:text-wt-text-primary opacity-0 group-hover:opacity-100 transition-all z-10"
    >
        <i data-lucide="more-vertical" class="w-4 h-4"></i>
    </button>
    
    <!-- Quick Actions Dropdown -->
    <div id="task-menu-{{ task.id }}" class="absolute top-8 right-2 bg-wt-bg-card border border-wt-border-subtle rounded-xl shadow-lg z-20 hidden min-w-40 py-1 task-menu">
        <div class="px-3 py-1.5 text-[10px] font-semibold text-wt-text-tertiary uppercase">Move to...</div>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'backlog')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-text-tertiary"></div>
            Backlog
        </button>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'todo')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-accent-blue"></div>
            To Do
        </button>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'in_progress')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-accent-indigo"></div>
            In Progress
        </button>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'blocked')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-accent-red"></div>
            Blocked
        </button>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'in_review')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-accent-orange"></div>
            In Review
        </button>
        <button onclick="event.stopPropagation(); moveTask({{ task.id }}, 'done')" class="w-full px-3 py-2 text-xs text-left text-wt-text-secondary hover:bg-wt-bg-page flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-wt-accent-green"></div>
            Done
        </button>
        <div class="border-t border-wt-border-subtle my-1"></div>
        <button onclick="event.stopPropagation(); deleteTask({{ task.id }})" class="w-full px-3 py-2 text-xs text-left text-wt-accent-red hover:bg-wt-accent-red-light flex items-center gap-2">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            Delete
        </button>
    </div>
    
    <!-- Title row with priority dot -->
    <div class="flex items-start gap-2 pr-8">
        <div class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0 priority-dot"></div>
        <span class="text-sm font-semibold text-wt-text-primary line-clamp-2">{{ task.title }}</span>
    </div>
    
    <!-- Description (first line only) -->
    {% match task.description %}
    {% when Some with (desc) %}
    <p class="text-xs text-wt-text-secondary line-clamp-1">{{ desc }}</p>
    {% when None %}
    {% endmatch %}
    
    <!-- Bottom row: Priority badge + Created by + Assignee -->
    <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
            <!-- Priority badge -->
            <span class="priority-badge px-2 py-0.5 rounded-full text-[10px] font-semibold">{{ task.priority }}</span>
            <!-- Created by badge -->
            <span class="created-by-badge text-xs" title="Created by {{ task.created_by }}"></span>
        </div>
        
        <!-- Assignee indicator -->
        <div class="assignee-icon w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0">
            <i data-lucide="user" class="w-3 h-3 assignee-lucide"></i>
        </div>
    </div>
</div>

<script>
(function() {
    const card = document.currentScript.previousElementSibling;
    if (!card) return;
    
    const priority = card.dataset.priority;
    const assigned = card.dataset.assigned;
    const createdBy = card.dataset.createdBy;
    
    // Priority dot
    const dot = card.querySelector('.priority-dot');
    if (dot) {
        if (priority === 'urgent') dot.classList.add('bg-wt-accent-red');
        else if (priority === 'high') dot.classList.add('bg-wt-accent-orange');
        else if (priority === 'normal') dot.classList.add('bg-wt-accent-blue');
        else dot.classList.add('bg-wt-accent-green');
    }
    
    // Priority badge
    const badge = card.querySelector('.priority-badge');
    if (badge) {
        if (priority === 'urgent') {
            badge.classList.add('bg-wt-accent-red-light', 'text-wt-accent-red');
        } else if (priority === 'high') {
            badge.classList.add('bg-wt-accent-orange-light', 'text-wt-accent-orange');
        } else if (priority === 'normal') {
            badge.classList.add('bg-wt-accent-blue-light', 'text-wt-accent-blue');
        } else {
            badge.classList.add('bg-wt-accent-green-light', 'text-wt-accent-green');
        }
    }
    
    // Created by badge
    const createdBadge = card.querySelector('.created-by-badge');
    if (createdBadge) {
        createdBadge.textContent = createdBy === 'agent' ? '🤖' : '👤';
    }
    
    // Assignee icon
    const assigneeIcon = card.querySelector('.assignee-icon');
    const assigneeLucide = card.querySelector('.assignee-lucide');
    if (assigneeIcon && assigneeLucide) {
        if (assigned === 'agent') {
            assigneeIcon.classList.add('bg-wt-accent-indigo');
            assigneeLucide.setAttribute('data-lucide', 'bot');
            assigneeLucide.classList.add('text-white');
        } else if (assigned === 'human') {
            assigneeIcon.classList.add('bg-wt-accent-green');
            assigneeLucide.setAttribute('data-lucide', 'user');
            assigneeLucide.classList.add('text-white');
        } else {
            assigneeIcon.classList.add('bg-wt-bg-card');
            assigneeLucide.setAttribute('data-lucide', 'help-circle');
            assigneeLucide.classList.add('text-wt-text-tertiary');
        }
    }
})();
</script>
