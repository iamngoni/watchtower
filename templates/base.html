<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Watchtower</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0F0F14">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wt: {
                            'bg-page': '#0F0F14',
                            'bg-sidebar': '#13131A',
                            'bg-card': '#1A1A24',
                            'border-subtle': '#1F1F2A',
                            'border-default': '#2A2A38',
                            'text-primary': '#F5F5F7',
                            'text-secondary': '#A0A0B0',
                            'text-tertiary': '#6B6B7A',
                            'accent-indigo': '#6366F1',
                            'accent-indigo-light': 'rgba(99, 102, 241, 0.15)',
                            'accent-green': '#22C55E',
                            'accent-green-light': 'rgba(34, 197, 94, 0.15)',
                            'accent-red': '#EF4444',
                            'accent-red-light': 'rgba(239, 68, 68, 0.15)',
                            'accent-orange': '#F59E0B',
                            'accent-orange-light': 'rgba(245, 158, 11, 0.15)',
                            'accent-blue': '#3B82F6',
                            'accent-blue-light': 'rgba(59, 130, 246, 0.15)',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'system-ui', 'sans-serif'],
                        display: ['Bricolage Grotesque', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0F0F14;
            font-family: 'DM Sans', system-ui, sans-serif;
        }
        .font-display {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A38;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3A3A48;
        }
        /* Live dot animation */
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-live {
            animation: pulse-live 2s ease-in-out infinite;
        }
        /* Kanban drag styles */
        .sortable-ghost {
            opacity: 0.4;
        }
        .sortable-chosen {
            opacity: 0.8;
        }
        /* Mobile sidebar overlay animation */
        .sidebar-overlay {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .sidebar-slide {
            transition: transform 0.3s ease;
        }
        .sidebar-slide.closed {
            transform: translateX(-100%);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-wt-bg-page text-wt-text-primary min-h-screen">
    <div class="flex min-h-screen">
        <!-- Desktop Sidebar (hidden on mobile) -->
        <aside class="hidden lg:flex w-[260px] bg-wt-bg-sidebar border-r border-wt-border-subtle flex-col fixed h-full z-30">
            <!-- Logo -->
            <div class="px-4 py-6">
                <div class="flex items-center gap-3 px-4 pb-6">
                    <div class="w-8 h-8 bg-wt-accent-indigo rounded-lg flex items-center justify-center">
                        <i data-lucide="radar" class="w-[18px] h-[18px] text-white"></i>
                    </div>
                    <span class="font-display text-lg font-bold text-wt-text-primary">Watchtower</span>
                </div>
                
                <!-- Navigation -->
                <nav class="space-y-1">
                    <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "dashboard" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Dashboard</span>
                    </a>
                    <a href="/feed" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "feed" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                        <span class="text-sm font-semibold">Feed</span>
                    </a>
                    <a href="/board" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "board" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="columns-3" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Board</span>
                    </a>
                    <a href="/costs" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "costs" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Costs</span>
                    </a>
                    <a href="/cron" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "cron" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Cron</span>
                    </a>
                    <a href="/sessions" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "sessions" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="history" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Sessions</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="mobile-sidebar-overlay" class="sidebar-overlay hidden fixed inset-0 bg-black/60 z-40 lg:hidden" onclick="closeMobileSidebar()"></div>
        
        <!-- Mobile Sidebar (slide-out) -->
        <aside id="mobile-sidebar" class="sidebar-slide closed fixed top-0 left-0 w-[280px] h-full bg-wt-bg-sidebar border-r border-wt-border-subtle flex flex-col z-50 lg:hidden">
            <div class="px-4 py-6">
                <div class="flex items-center justify-between px-4 pb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-wt-accent-indigo rounded-lg flex items-center justify-center">
                            <i data-lucide="radar" class="w-[18px] h-[18px] text-white"></i>
                        </div>
                        <span class="font-display text-lg font-bold text-wt-text-primary">Watchtower</span>
                    </div>
                    <button onclick="closeMobileSidebar()" class="p-2 rounded-lg hover:bg-wt-bg-card text-wt-text-secondary">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <!-- Navigation -->
                <nav class="space-y-1">
                    <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "dashboard" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Dashboard</span>
                    </a>
                    <a href="/feed" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "feed" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                        <span class="text-sm font-semibold">Feed</span>
                    </a>
                    <a href="/board" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "board" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="columns-3" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Board</span>
                    </a>
                    <a href="/costs" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "costs" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Costs</span>
                    </a>
                    <a href="/cron" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "cron" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Cron</span>
                    </a>
                    <a href="/sessions" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors {% if active_page == "sessions" %}bg-wt-accent-indigo-light text-wt-accent-indigo{% else %}text-wt-text-secondary hover:bg-wt-bg-card{% endif %}">
                        <i data-lucide="history" class="w-5 h-5"></i>
                        <span class="text-sm font-medium">Sessions</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-[260px] pb-20 lg:pb-0">
            <!-- Mobile Header -->
            <div class="lg:hidden flex items-center justify-between px-4 py-3 border-b border-wt-border-subtle bg-wt-bg-sidebar">
                <button onclick="openMobileSidebar()" class="p-2 rounded-lg hover:bg-wt-bg-card text-wt-text-secondary">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-wt-accent-indigo rounded-md flex items-center justify-center">
                        <i data-lucide="radar" class="w-3.5 h-3.5 text-white"></i>
                    </div>
                    <span class="font-display text-sm font-bold text-wt-text-primary">Watchtower</span>
                </div>
                <div class="w-9"></div>
            </div>
            {% block content %}{% endblock %}
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-wt-bg-sidebar border-t border-wt-border-subtle z-30">
            <div class="flex items-center justify-around py-2">
                <a href="/feed" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg {% if active_page == "feed" %}text-wt-accent-indigo{% else %}text-wt-text-tertiary{% endif %}">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium">Feed</span>
                </a>
                <a href="/board" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg {% if active_page == "board" %}text-wt-accent-indigo{% else %}text-wt-text-tertiary{% endif %}">
                    <i data-lucide="columns-3" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium">Board</span>
                </a>
                <a href="/costs" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg {% if active_page == "costs" %}text-wt-accent-indigo{% else %}text-wt-text-tertiary{% endif %}">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium">Costs</span>
                </a>
                <a href="/cron" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg {% if active_page == "cron" %}text-wt-accent-indigo{% else %}text-wt-text-tertiary{% endif %}">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium">Cron</span>
                </a>
                <a href="/sessions" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg {% if active_page == "sessions" %}text-wt-accent-indigo{% else %}text-wt-text-tertiary{% endif %}">
                    <i data-lucide="history" class="w-5 h-5"></i>
                    <span class="text-[10px] font-medium">Sessions</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Task Detail Modal Container - Full screen on mobile -->
    <div id="task-detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-0 sm:p-4">
        <div id="task-detail-content" class="bg-wt-bg-sidebar h-full sm:h-auto sm:rounded-2xl w-full sm:max-w-2xl sm:max-h-[90vh] overflow-y-auto border-0 sm:border border-wt-border-subtle">
            <!-- Content loaded via HTMX -->
        </div>
    </div>

    <script>
        // Mobile sidebar functions
        function openMobileSidebar() {
            document.getElementById('mobile-sidebar-overlay').classList.remove('hidden');
            document.getElementById('mobile-sidebar').classList.remove('closed');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMobileSidebar() {
            document.getElementById('mobile-sidebar-overlay').classList.add('hidden');
            document.getElementById('mobile-sidebar').classList.add('closed');
            document.body.style.overflow = '';
        }

        // Task detail modal functions
        function openTaskDetail(taskId) {
            const modal = document.getElementById('task-detail-modal');
            const content = document.getElementById('task-detail-content');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            
            // Load content via HTMX
            htmx.ajax('GET', '/partials/tasks/' + taskId + '/detail', {target: '#task-detail-content', swap: 'innerHTML'});
        }
        
        function closeTaskDetail() {
            const modal = document.getElementById('task-detail-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }
        
        // Close modal when clicking outside
        document.getElementById('task-detail-modal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                closeTaskDetail();
            }
        });

        // Format timestamps (shared utility)
        function formatRelativeTime(timestamp) {
            const now = Math.floor(Date.now() / 1000);
            const diff = now - timestamp;
            
            if (diff < 0) {
                // Future time
                const absDiff = Math.abs(diff);
                if (absDiff < 60) return 'in ' + absDiff + 's';
                if (absDiff < 3600) return 'in ' + Math.floor(absDiff / 60) + 'm';
                if (absDiff < 86400) return 'in ' + Math.floor(absDiff / 3600) + 'h';
                return 'in ' + Math.floor(absDiff / 86400) + 'd';
            }
            
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }
        
        function formatAllTimestamps() {
            document.querySelectorAll('[data-timestamp]').forEach(el => {
                const ts = parseInt(el.dataset.timestamp);
                if (!isNaN(ts)) {
                    el.textContent = formatRelativeTime(ts);
                }
            });
        }

        // Format numbers with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function formatCurrency(num) {
            return '$' + num.toFixed(2);
        }
        
        function formatAllNumbers() {
            document.querySelectorAll('[data-format-number]').forEach(el => {
                const num = parseInt(el.dataset.formatNumber);
                if (!isNaN(num)) {
                    el.textContent = formatNumber(num);
                }
            });
            document.querySelectorAll('[data-format-currency]').forEach(el => {
                const num = parseFloat(el.dataset.formatCurrency);
                if (!isNaN(num)) {
                    el.textContent = formatCurrency(num);
                }
            });
        }

        // Initialize Lucide icons
        lucide.createIcons();
        
        // Format timestamps on load
        formatAllTimestamps();
        formatAllNumbers();
        
        // Update timestamps periodically
        setInterval(formatAllTimestamps, 30000);
    </script>
    {% block scripts %}{% endblock %}

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none lg:bottom-6 lg:right-6"></div>
    
    <script>
        // Toast notification system
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-wt-accent-green text-white',
                error: 'bg-wt-accent-red text-white',
                warning: 'bg-wt-accent-orange text-white',
                info: 'bg-wt-accent-indigo text-white'
            };
            
            const icons = {
                success: 'check-circle',
                error: 'alert-circle',
                warning: 'alert-triangle',
                info: 'info'
            };
            
            toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 pointer-events-auto transform translate-x-full opacity-0 transition-all duration-300 max-w-sm`;
            toast.innerHTML = `
                <i data-lucide="${icons[type] || icons.info}" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm font-medium">${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            });
            
            // Auto-dismiss after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // Make it globally available
        window.showToast = showToast;
    </script>
</body>
</html>
