[package]
name = "watchtower"
version = "0.1.0"
edition = "2021"
authors = ["Ngonidzashe Mangudya"]
description = "A self-hosted agent monitoring dashboard for OpenClaw"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4.9"
actix-files = "0.6"
actix-rt = "2.10"

# Templates
askama = "0.12"
askama_actix = "0.14"

# Async runtime
tokio = { version = "1.42", features = ["full", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
once_cell = "1.20"
futures = "0.3"
